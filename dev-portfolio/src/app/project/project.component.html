<ul class="divide-y">

    <li *ngFor="let project of projectList" 
    [routerLink]="[project.path]"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{exact: true}" 
    class="py-4 text-2xl active:text-teal-700 active:font-medium hover:text-teal-700 focus:text-teal-700 focus:font-semibold">
    {{project.name}}
    </li>

</ul>
