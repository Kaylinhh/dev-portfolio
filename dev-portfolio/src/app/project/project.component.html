<ul class="fade-in mb-32 mt-14 mx-4 flex flex-col-reverse">

    <li *ngFor="let project of projectList" 
    [routerLink]="[project.path]"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{exact: true}" 
    class="py-4 text-2xl border-t border-white active:text-teal-700 active:font-medium hover:text-teal-700 focus:text-teal-700 focus:font-semibold cursor-pointer">
    {{project.name}}
    </li>

</ul>
